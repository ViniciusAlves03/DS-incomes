openapi: 3.0.0
info:
  title: Incomes Service API
  version: "1.0.0"
  description: "Microservice for managing user incomes."
servers:
  - url: http://localhost:7000/
    description: Local development server

paths:
  /v1/incomes:
    get:
      tags:
        - Incomes
      summary: List all Incomes
      description: Returns a paginated list of all incomes registered in the system.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page.
      responses:
        '200':
          description: List of incomes returned successfully.
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of incomes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Income'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /v1/incomes/{income_id}:
    get:
      tags:
        - Incomes
      summary: Get Income by ID
      description: Returns the details of a specific income.
      parameters:
        - name: income_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Income'
        '404':
          description: Income not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /v1/users/{user_id}/incomes:
    post:
      tags:
        - Users
      summary: Add a new Income for a User
      description: Creates a new income for a specific user.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeInput'
      responses:
        '201':
          description: Income created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Income'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
        - Users
      summary: List all Incomes for a User
      description: Returns a paginated list of all incomes for a specific user.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page.
      responses:
        '200':
          description: List of incomes returned successfully.
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of incomes for the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Income'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /v1/users/{user_id}/incomes/{income_id}:
    get:
      tags:
        - Users
      summary: Get Income for a User by ID
      description: Returns the details of a specific income for a user.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
        - name: income_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Income'
        '404':
          description: Income not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
        - Users
      summary: Update an Income for a User
      description: Updates the data of an existing income for a user.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
        - name: income_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeUpdate'
      responses:
        '200':
          description: Income updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Income'
        '404':
          description: Income not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - Users
      summary: Remove an Income for a User
      description: Removes an existing income for a user.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
        - name: income_id
          in: path
          required: true
          schema:
            type: string
            format: mongoId
      responses:
        '204':
          description: Income removed successfully.
        '404':
          description: Income not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    Income:
      type: object
      properties:
        id:
          type: string
          format: mongoId
          readOnly: true
        title:
          type: string
          example: "Monthly Salary"
        description:
          type: string
          example: "Payment for the month of March"
        amount:
          type: number
          example: 3500.00
        date:
          type: string
          format: date
          example: "2024-03-05"
        categoryId:
          type: string
          format: mongoId
        userId:
          type: string
          format: mongoId
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    IncomeInput:
      type: object
      properties:
        title:
          type: string
          example: "Online product sale"
        description:
          type: string
          example: "Sale of used item in marketplace"
        amount:
          type: number
          example: 150.00
        date:
          type: string
          format: date
          example: "2024-03-20"
        categoryId:
          type: string
          format: mongoId
      required:
        - title
        - amount

    IncomeUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: mongoId

    ApiError:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        description:
          type: string
